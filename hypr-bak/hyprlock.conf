# ==================================================
# OMARCHY — ÆON GLASS HYPRLOCK
# Premium VisionOS-Inspired Lock Screen
# ==================================================

source = ~/.config/omarchy/current/theme/hyprlock.conf

# ==================================================
# GENERAL
# ==================================================

general {
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
}


# ==================================================
# BACKGROUND — Cinematic Dimmed Canvas
# ==================================================

background {
    monitor =
    path = ~/.config/omarchy/current/background

    blur_passes = 1
    blur_size = 2

    noise = 0.02
    contrast = 1.05
    brightness = 0.5

    vibrancy = 0.15
    vibrancy_darkness = 0.1

    color = $color
}

# ==================================================
# TOP AMBIENT BAR — Minimal Status
# ==================================================

# --- Time Layout (left) ---
label {
    monitor =
    text = $TIME

    color = $font_color

    font_size = 11
    font_family = JetBrainsMono Nerd Font Medium

    position = 52, -38
    halign = left
    valign = top
}


label {
monitor =

text = sheikh_robin
color = $font_color

font_size = 11
font_family = JetBrainsMono Nerd Font

position = -74, -40

halign = right
valign = top

}


# ==================================================
# DATE (Layer 3)
# ==================================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A • %d %B %Y')"

    color = $font_color

    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, -40

    halign = center
    valign = top
}

# ==================================================
# PASSWORD INPUT — Frosted Glass Panel (Layer 2)
# ==================================================

input-field {
    monitor =

    size = 250, 45

    position = 0, 240 

    halign = center
    valign = bottom

    rounding = 4
    outline_thickness = 1

    dots_center = true
    dots_spacing = 0.32
    dots_size = 0.18

    fade_on_empty = false
    hide_input = false

    inner_color = $inner_color
    outer_color = $outer_color

    check_color = $check_color
    fail_color = $outer_color

    font_color = $font_color

    placeholder_text = <span> Enter Password 󰈷 </span>
    placeholder_text_color = $font_color

    fail_text = Authentication failed
    fail_text_color = $outer_color

    capslock_color = $outer_color

    font_family = JetBrainsMono Nerd Font
    font_size = 15

    shadow_passes = 3
    shadow_size = 6
}

