# ==================================================
# Hyprlock — macOS "Glass" Edition
# ==================================================

# ---------- ANIMATIONS (The "Smooth" Part) ----------
animations {
    enabled = true
    bezier = appleDefault, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 7, appleDefault
    animation = fadeOut, 1, 7, appleDefault
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/my-env/wallpapers/wireballblack.png
    # macOS style blur
    blur_passes = 1
    blur_size = 3
    contrast = 0.89
    brightness = 0.81
}

# ---------- USER LABEL ----------
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 255, 255, 0.75)
    font_size = 24
    font_family = Fira Semibold
    position = 0, -120
    halign = center
    valign = center
}

# ---------- INPUT FIELD (Sleek Glass) ----------
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Fira Semibold
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = 20
    check_color = rgba(156, 207, 216, 0.8)
    fail_color = rgba(235, 111, 146, 0.8)
    position = 0, -210
    halign = center
    valign = center
}

# ---------- CLOCK (Top Center) ----------
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 110
    font_family = Fira Semibold
    position = 0, 280
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
}

# ---------- DATE ----------
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 28
    font_family = Fira Semibold
    position = 0, 150
    halign = center
    valign = center
}
