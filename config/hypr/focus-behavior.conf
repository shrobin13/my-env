# ==================================================
# Hyprland Focus & Behavior Configuration — Optimized
# ==================================================

# ─────────────────────────────────────────────────────────
# FOCUS BEHAVIOR (NEW section for clarity)
# ─────────────────────────────────────────────────────────

general {
  # Focus Following Mouse
  # 0 = disabled, 1 = enabled, 2 = enabled + raise window
  focus_follows_mouse = 1                      # Standard: focus follows, doesn't raise

  # Focus Wrapping (NEW in Hyprland 1.8+)
  # Allow Alt+Tab to cycle across all workspaces
  focus_to_other_workspaces = true

  # Workspace Cycling
  # Mouse wheel wraps at edges when using Super+scroll
  allow_workspace_cycles = true

  # Floating Window Center
  center_new_windows = false                   # Don't auto-center new floating windows

  # New Window Default Focus
  no_focus_fallback = false                    # Focus new windows if possible
}

# ─────────────────────────────────────────────────────────
# DWINDLE LAYOUT OPTIMIZATION (already good, enhanced here)
# ─────────────────────────────────────────────────────────

dwindle {
  # Split Behavior
  preserve_split = true                        # Keep split orientation when moving windows
  smart_split = false                          # true = split based on cursor position

  # Window Expansion
  smart_resizing = true                        # Easier window resizing

  # Default Split Ratio
  default_split_ratio = 1.0                    # Even split by default (50/50)

  # Split Width Multiplier
  split_width_multiplier = 1.0                 # 1.0 = normal, >1.0 = favor parent

  # Active for Splits
  use_active_for_splits = true                 # Use active window for split direction

  # Force Proper Scaling
  force_no_xinerama = false                    # Let X11 handle multi-monitor
}

# ─────────────────────────────────────────────────────────
# MASTER LAYOUT (Alternative, commented for now)
# ─────────────────────────────────────────────────────────

# Uncomment if you want to try master layout:
# master {
#   new_status = master                        # New windows become master
#   new_on_top = false                         # New windows go to top/bottom
#   orientation = left                         # Master on left/right
#   inherit_fullscreen = true                  # Master inherits fullscreen state
# }

# ─────────────────────────────────────────────────────────
# WINDOW FLOAT BEHAVIOR
# ─────────────────────────────────────────────────────────

general {
  # Float Override Layout
  # How windows behave when floated
  float_override_layout = 2                    # 2 = keep tiling behavior

  # Resize on Border
  resize_on_border = false                     # Don't resize by dragging window edge

  # Allow Tearing
  # VRR (Variable Refresh Rate) specific
  allow_tearing = false                        # Disable unless you need it (advanced)
}

# ─────────────────────────────────────────────────────────
# DAMAGE TRACKING (Performance)
# ─────────────────────────────────────────────────────────

# NEW: Add to general block if you want fine-grained control
general {
  # Damage Tracking Strategy
  # This affects how Hyprland redraws regions
  # Default is usually optimal, but can be tweaked
  # (Requires Hyprland 0.41+)

  # damage_tracking = full                    # Full damage (safe, potentially slower)
  # damage_tracking = monitor                 # Per-monitor damage (recommended)
  # damage_tracking = none                    # No damage tracking (not recommended)
}

# ─────────────────────────────────────────────────────────
# WINDOW RULES RECOMMENDATIONS
# ─────────────────────────────────────────────────────────

# These should go in windowrules.conf (separate file):

# Workspace-specific behavior
# windowrule = workspace 1, ^kitty$             # New Kitty windows on workspace 1
# windowrule = workspace special:chat, ^discord$  # Discord on chat scratchpad

# Floating for specific apps
# windowrule = float, ^(pavucontrol|nmtui|htop)$

# No animations for popups
# windowrule = no_animation, ^(ibus-ui-gtk3)$

# Confine pointer (NEW feature)
# windowrule = confine_pointer, ^kitty$        # Keep pointer in terminal
# windowrule = confine_pointer, ^rofi$         # Keep pointer in launcher

# ─────────────────────────────────────────────────────────
# GESTURE FOCUS BEHAVIOR
# ─────────────────────────────────────────────────────────

# In gestures.conf:
# gesture = 3, horizontal, workspace           # 3-finger swipe changes workspace
# gesture = 3, up, fullscreen                  # 3-finger up toggles fullscreen

# These gestures respect the focus_to_other_workspaces setting
# when swiping between workspace groups

# ─────────────────────────────────────────────────────────
# NOTES
# ─────────────────────────────────────────────────────────
# • Focus behavior should feel transparent (you don't think about it)
# • Preserve split = better for muscle memory
# • Smart resizing = faster window adjustments
# • Allow workspace cycles = reduces edge case mistakes
# • focus_follows_mouse = improve pointer-based navigation
