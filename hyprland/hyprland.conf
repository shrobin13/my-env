source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/programs.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/environt.conf
source = ~/.config/hypr/window-border.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/gestures.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf

# master {
#   new_status = master
# }

dwindle {
    preserve_split = true         # Keep split orientation fixed
    smart_split = false           # Optional: enable for cursor-based splits
    smart_resizing = true         # Easier window resizing
    default_split_ratio = 1.0     # Even split by default
    split_width_multiplier = 1.0  # Adjust for widescreens if needed
    use_active_for_splits = true  # Prefer active window for split
}

misc {
  force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. 
}

device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

