
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 1

    # Active border with brighter version of your teal-ish color
    col.active_border = rgba(90,120,120,1) rgba(90,120,120,0.8) 45deg

    # Inactive border stays the same
    col.inactive_border = rgba(110,106,134,0.5)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

