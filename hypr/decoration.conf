decoration {
    rounding = 3
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
      enabled = true
        size = 6
        passes = 2
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    layerrule = blur, rofi          # blur the whole launcher
    layerrule = ignorezero, rofi    # keep rounded corners crisp
    layerrule = blur, waybar
    layerrule = ignorezero, waybar
    layerrule = blur, swaync
    layerrule = ignorezero, swaync
}


