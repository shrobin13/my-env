
# ==================================================
# Hyprland Animations — UI-centric, minimal motion
# Tuned for: Hyprland + Waybar + swaync
# Style: Clean, calm, professional (no bounce)
# ==================================================

# ---------- Motion Control ----------
$anim_enable = 1

# Base timing (global baseline)
$anim_speed = 3.0

# Relative speeds (important contrast)
$anim_fast = 3.2
$anim_slow = 3.8

animations {
    enabled = $anim_enable

    # ---------- Bezier Curves ----------
    # Smooth window easing (no overshoot)
    bezier = easeOutQuint,    0.22, 1.00, 0.36, 1.00

    # Balanced global curve
    bezier = easeInOutCubic,  0.65, 0.05, 0.36, 1.00

    # Workspace motion (near-linear, nausea-free)
    bezier = uiLinear,        0.40, 0.00, 0.60, 1.00

    # Fast UI fades (panels, notifications)
    bezier = quickFade,       0.20, 0.00, 0.00, 1.00


    # ---------- Global ----------
    animation = global, 1, $anim_speed, easeInOutCubic


    # ---------- Windows ----------
    animation = windows,    1, $anim_speed, easeOutQuint
    animation = windowsIn,  1, $anim_slow,  easeOutQuint, popin 88%
    animation = windowsOut, 1, $anim_fast,  easeInOutCubic


    # ---------- Borders ----------
    animation = border, 1, $anim_fast, easeOutQuint


    # ---------- Fades ----------
    animation = fade,    1, $anim_fast, quickFade
    animation = fadeIn,  1, $anim_fast, uiLinear
    animation = fadeOut, 1, $anim_fast, uiLinear


    # ---------- Layers (Waybar, swaync, rofi) ----------
    animation = layers,    1, $anim_speed, easeOutQuint
    animation = layersIn,  1, $anim_fast,  easeOutQuint, fade
    animation = layersOut, 1, $anim_fast,  easeInOutCubic, fade


    # ---------- Workspaces (keyboard switching) ----------
    animation = workspaces,    1, $anim_fast, uiLinear, fade
    animation = workspacesIn,  1, $anim_fast, uiLinear, fade
    animation = workspacesOut, 1, $anim_fast, uiLinear, fade
}

