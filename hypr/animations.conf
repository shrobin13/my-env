# # ==================================================
# # Hyprland Animations — Fluid, Wavy & Harmonic
# # ==================================================
#
# # ---------- Motion Control ----------
# $anim_enable = 1
#
# # Speed calibration (Lower = Faster in Hyprland's logic)
# # A value of 5-6 provides that "syrupy" premium smoothness
# $anim_base = 5.5
# $anim_fast = 4.0
# $anim_slow = 7.0
#
# animations {
#     enabled = $anim_enable
#
#     # ---------- Custom Bézier Curves ----------
#     # The "Wavy" Curve: Subtle overshoot and soft landing
#     bezier = fluidOut, 0.16, 1, 0.3, 1
#
#     # The "Slow-In": For a heavy, premium feel
#     bezier = softAcquire, 0.65, 0, 0.35, 1
#
#     # The "Snappy-Smooth": For UI elements that need to feel responsive
#     bezier = easeOutExpo, 0.16, 1, 0.3, 1
#
#     # The "Organic": High curvature for maximum smoothness
#     bezier = wavy, 0.05, 0.9, 0.1, 1.05
#
#     # ---------- Windows ----------
#     # windowsIn uses 'wavy' for that slight bounce/expansion
#     animation = windows, 1, $anim_base, wavy
#     animation = windowsIn, 1, $anim_base, wavy, popin 80%
#     animation = windowsOut, 1, $anim_fast, softAcquire, popin 85%
#
#     # ---------- Borders & Fades ----------
#     # Fast transitions for color changes to keep the UI feeling "tight"
#     animation = border, 1, $anim_fast, default
#     animation = borderangle, 1, 20, default, loop
#     animation = fade, 1, $anim_fast, easeOutExpo
#
#     # ---------- Layers (Waybar, Rofi, etc.) ----------
#     # Give them a soft slide-and-fade
#     animation = layers, 1, $anim_base, fluidOut, fade
#     animation = layersIn, 1, $anim_fast, fluidOut, fade
#     animation = layersOut, 1, $anim_slow, softAcquire, fade
#
#     # ---------- Workspaces ----------
#     # This is where the "wavy" feel happens. 
#     # slidefade 20% gives it a horizontal movement with a soft opacity transition.
#     animation = workspaces, 1, $anim_base, wavy, slidefade 20%
# }

# ==================================================
# Hyprland Animations — macOS "Liquid" Style
# ==================================================

$anim_enable = 1

# macOS feels "heavy" but fast. 
$anim_base = 6.0
$anim_fast = 4.5
$anim_slow = 8.0

animations {
    enabled = $anim_enable

    # ---------- macOS Bézier Curves ----------
    # The 'Apple Default' feel: Fast start, very long tail
    bezier = appleDefault, 0.25, 1, 0.5, 1
    
    # For windows opening (slight 'Scale' effect)
    bezier = appleSnap, 0.4, 0, 0.2, 1
    
    # For workspace sliding (linear-to-smooth)
    bezier = appleWorkspace, 0.33, 1, 0.68, 1

    # ---------- Windows ----------
    # macOS doesn't bounce; it "slides" into place.
    animation = windows, 1, $anim_base, appleDefault
    animation = windowsIn, 1, $anim_base, appleDefault, popin 90%
    animation = windowsOut, 1, $anim_fast, appleSnap, popin 95%
    
    # ---------- Borders & Fades ----------
    # Fades in macOS are very subtle and quick
    animation = fadeIn, 1, $anim_fast, appleDefault
    animation = fadeOut, 1, $anim_fast, appleDefault
    
    # ---------- Layers (Waybar, Rofi, etc.) ----------
    # mimics the "Slide down" or "Sheet" effect
    animation = layers, 1, $anim_base, appleDefault, slide
    animation = layersIn, 1, $anim_fast, appleDefault, slide
    animation = layersOut, 1, $anim_slow, appleSnap, slide

    # ---------- Workspaces ----------
    # This mimics the "Mission Control" or Trackpad swipe feel
    animation = workspaces, 1, $anim_base, appleWorkspace, slide
}
