
general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/my-env/wallpapers/Glitch.png
}

# ----------------------------
# INPUT FIELD - Sleek Glass Style
# ----------------------------
input-field {
    monitor =
    size = 280, 50
    dots_size = 0.3
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255, 255, 255, 0.08)  # subtle glass feel
    font_color = rgba(255, 255, 255, 1)      # pure white text
    font_family = "Fira Semibold"
    outer_color = rgba(255, 255, 255, 0.15)
    outline_thickness = 2
    fade_on_empty = true
    fade_timeout = 800
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    rounding = 30
    check_color = #9ccfd8      # Rose Pine primary (foam blue)
    fail_color = #eb6f92       # Rose Pine error (love pink-red)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = #f6c177   # Rose Pine warning (gold)
    numlock_color = #9ccfd8    # same as primary
    bothlock_color = #eb6f92   # error red
    invert_numlock = false
    swap_font_color = true
    position = 0, -30
    halign = center
    valign = center
    shadow_passes = 12
    shadow_size = 25
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.8
}

# ----------------------------
# CLOCK LABEL - Minimal Elegance
# ----------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = #e0def4        # Rose Pine foreground
    font_size = 60
    font_family = "Fira Semibold"
    position = -50, 60
    halign = right
    valign = bottom
    shadow_passes = 6
    shadow_size = 14
    shadow_color = rgba(0,0,0,0.45)
}

# ----------------------------
# USER LABEL - Subtle, sleek
# ----------------------------
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.85)
    font_size = 24
    font_family = "Fira Semibold"
    position = -50, 140
    halign = right
    valign = bottom
    shadow_passes = 6
    shadow_size = 12
    shadow_color = rgba(0,0,0,0.35)
}

# ----------------------------
# IMAGE - Profile/Wallpaper Accent
# ----------------------------
image {
    monitor =
    path = "$HOME/my-env/wallpapers/Glitch.png"
    size = 320
    rounding = 50
    border_size = 5
    border_color = rgba(255,255,255,0.25)
    rotate = 0
    reload_time = -1
    position = 0, 240
    halign = center
    valign = center
    shadow_passes = 14
    shadow_size = 30
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 2
}

