general {
    lock_cmd = pidof hyprlock || hyprlock       
    before_sleep_cmd = loginctl lock-session    
    after_sleep_cmd = hyprctl dispatch dpms on  
}

# 1. PRE-LOCK DIM (5 min)
# Makes the screen dim significantly to "warn" you before it locks.
listener {
    timeout = 300                                
    on-timeout = brightnessctl -s set 10%         
    on-resume = brightnessctl -r                 
}

# 2. THE LOCK (5 min 30 sec)
# We lock shortly after dimming. 
# Also, we pause music here for that premium "away from desk" feel.
listener {
    timeout = 330                            
    on-timeout = playerctl pause; loginctl lock-session 
}

# 3. DPMS OFF (6 min)
# Turn off the display shortly after locking to save power/OLED life.
listener {
    timeout = 360                                
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         
}

# 4. SUSPEND (10 min)
listener {
    timeout = 600                                
    on-timeout = systemctl suspend                
}
