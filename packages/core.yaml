packages:
  # Core compositor
  core:
    - hyprland
    - hyprland-git
    - hyprctl

  # Wayland utilities
  wayland:
    - wayland
    - wl-clipboard
    - wl-paste
    - wayland-protocols
    - libxkbcommon
    - xwayland

  # Status bar & notifications
  ui:
    - waybar
    - swaync
    - dunst

  # Launcher & menus
  applets:
    - rofi
    - rofi-wayland
    - jq
    - dmenu

  # Terminal & multiplexer
  terminal:
    - kitty
    - tmux
    - zsh
    - oh-my-zsh-git

  # Editors
  editors:
    - neovim
    - vim
    - visual-studio-code-bin

  # Development
  development:
    - git
    - gcc
    - make
    - cmake
    - base-devel
    - nodejs
    - npm
    - python
    - python-pip

  # Utilities
  utilities:
    - fzf
    - ripgrep
    - fd
    - bat
    - exa
    - curl
    - wget
    - imagemagick
    - ffmpeg

  # Input/Output
  input:
    - libinput
    - libinput-gestures
    - xdg-desktop-portal
    - xdg-desktop-portal-hyprland

  # System management
  system:
    - systemd
    - systemd-resolvconf
    - bluez
    - bluez-utils
    - pulseaudio
    - pavucontrol
    - brightnessctl

  # Appearance
  appearance:
    - gtk3
    - gtk4
    - qt5-base
    - qt6-base
    - qt5ct
    - qt6ct
    - papirus-icon-theme
    - noto-fonts
    - noto-fonts-emoji

  # Optional: Development tools
  optional_dev:
    - docker
    - docker-compose
    - postgresql
    - redis
    - java-openjdk
    - dotnet-sdk
    - rust
    - go

  # Optional: Media
  optional_media:
    - vlc
    - mpv
    - gimp
    - blender

  # Optional: Communication
  optional_comm:
    - discord
    - telegram-desktop
    - slack-desktop
    - thunderbird

profile_overrides:
  laptop:
    exclude: [docker, postgresql, redis, blender]
    include: [tlp, power-profiles-daemon, laptop-mode-tools]

  workstation:
    include: [docker, postgresql, redis, java-openjdk, nvidia-utils]

  vm:
    exclude: [nvidia-utils, tlp]
    include: [open-vm-tools, qemu-guest-agent]

# Systemd services to enable/start
systemd_services:
  user:
    - bluetooth
    - pulseaudio
    - swaync
    - waybar

  system:
    - bluetoothd
    - systemd-udevd

# Environment setup
environment:
  XDG_CURRENT_DESKTOP: Hyprland
  XDG_SESSION_TYPE: wayland
  QT_QPA_PLATFORM: wayland
  MOZ_ENABLE_WAYLAND: '1'
  LIBVA_DRIVER_NAME: radeonsi
  CLUTTER_BACKEND: wayland
